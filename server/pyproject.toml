[project]
name = "zeroctl-server"
version = "0.1.0"
description = "ZeroOps Workshop - Server (FastAPI + State Machine + Worker)"
authors = [
    { name = "Collaborator 2", email = "server-core@zeroctl.dev" },
    { name = "Collaborator 3", email = "server-worker@zeroctl.dev" }
]
requires-python = ">=3.10"

dependencies = [
    # FastAPI & Web
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    
    # Docker SDK
    "docker>=7.0.0",
    
    # Database & Storage
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    
    # Async & Concurrency
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
    
    # Logging & Monitoring
    "python-json-logger>=2.0.7",
    
    # Utilities
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
