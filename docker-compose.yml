version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: zeroops-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker grading
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - zeroops-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: zeroops-client
    stdin_open: true
    tty: true
    depends_on:
      - server
    environment:
      - ZEROOPS_SERVER_URL=http://server:8000
      - ZEROOPS_SESSION_TOKEN=${ZEROOPS_SESSION_TOKEN:-default-user}
      - TERM=xterm-256color
    volumes:
      - ~/rendudevops:/root/rendudevops
    networks:
      - zeroops-network

networks:
  zeroops-network:
    driver: bridge
